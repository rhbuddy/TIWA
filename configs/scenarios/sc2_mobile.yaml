name: sc2_mobile
area_m: [15, 9]
duration_s: 600
warmup_s: 30
step_s: 1
channels: [1, 6, 11]
aps:
  - {id: 0, pos: [3.5, 2.7], channel: 11}
  - {id: 1, pos: [5.5, 7.7], channel: 6}
  - {id: 2, pos: [11.5, 5.0], channel: 1}
background_stas:
  count: 20
  placement: uniform
  mobility: static
  traffic: {type: cbr, mbps: 1.0}
mobile_stas:
  count: 2
  placement: uniform
  mobility: scripted
  speed_mps: [0.5, 1.5]
  # Approximation of the cross-floor route in TiWA Fig. 4; each waypoint has a 120 s stop.
  scripted_path: [[3.7, 6.4, 120], [7.1, 3.7, 120], [10.7, 4.4, 120], [6.0, 6.8, 120]]
  traffic: {type: cbr, mbps: 1.0}
propagation: {pl0_db: 40, exponent: 3.0, shadow_sigma_db: 4.0, shadow_rho: 0.95, rssi_noise_db: 2.0}
mac: {efficiency: 0.6, c_max: 0.9, tau: 0.01, retry_limit: 7}
handover: {mode: lvap, outage_s: 0.2, dwell_s: 10, channel_change_dwell_s: 60, max_moves_per_cycle: 2}
