name: tiwa_exp1_aspect2
area_m: [15, 9]
duration_s: 1200
warmup_s: 60
step_s: 1
channels: [1, 6, 11]
# Same approximate AP layout and explicit Aspect-1 grouping assumption as the baseline.
aps:
  - {id: 0, pos: [3.5, 2.7], channel: 11}
  - {id: 1, pos: [5.5, 7.7], channel: 6}
  - {id: 2, pos: [11.5, 5.0], channel: 1}
groups:
  - count: 6
    placement: per_ap
    spread_m: 0.5
    mobility: static
    traffic: {type: cbr, mbps: 1.0}
  - count: 24
    placement: overlap
    center_m: [6.5, 6.0]
    spread_m: 0.25
    mobility: static
    traffic: {type: cbr, mbps: 1.0}
  # The paper says the extra ten STAs occupy one AP's service area but does not
  # publish exact coordinates; this hotspot is an explicit approximation near AP 1.
  - count: 10
    placement: hotspot
    center_m: [5.5, 7.0]
    spread_m: 0.5
    mobility: static
    traffic: {type: cbr, mbps: 1.0}
propagation: {pl0_db: 40, exponent: 3.0, shadow_sigma_db: 4.0, shadow_rho: 0.95, rssi_noise_db: 2.0}
mac: {efficiency: 0.2, c_max: 0.9, tau: 0.01, retry_limit: 7}
handover: {mode: lvap, outage_s: 0.2, dwell_s: 10, channel_change_dwell_s: 60, max_moves_per_cycle: 2}
measurement_noise: true
