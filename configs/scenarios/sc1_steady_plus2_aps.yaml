  - {id: 1, pos: [5.5, 7.7], channel: 6}
  - {id: 2, pos: [11.5, 5.0], channel: 1}
  - {id: 3, pos: [8.5, 4.5], channel: 6}
  - {id: 4, pos: [4.5, 4.5], channel: 1}
